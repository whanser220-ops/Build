name: Unity CI

"on":
  workflow_dispatch:
  push:
    branches:
      - codex/111

concurrency:
  group: unity6-player-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Android and Windows
    runs-on:
      - self-hosted
      - Windows
      - unity6
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean previous CI outputs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path ".workspace/builds") {
            Remove-Item -LiteralPath ".workspace/builds" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path ".workspace/builds/android" | Out-Null
          New-Item -ItemType Directory -Force -Path ".workspace/builds/windows" | Out-Null
          New-Item -ItemType Directory -Force -Path "Logs" | Out-Null
          Remove-Item -LiteralPath "Logs/EditMode.xml" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "Logs/EditMode.log" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "Logs/build-android.log" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "Logs/build-windows.log" -Force -ErrorAction SilentlyContinue

      - name: Run build pipeline EditMode tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\Invoke-Unity.ps1 -ProjectPath . -batchmode `
            -runTests -testPlatform EditMode `
            -assemblyNames Project.BuildPipeline.EditMode.Tests `
            -testResults Logs/EditMode.xml `
            -logFile Logs/EditMode.log
          .\tools\Wait-CiOutput.ps1 `
            -Path Logs/EditMode.xml `
            -Label "Unity EditMode test results" `
            -TimeoutSeconds 1200 `
            -LogPath Logs/EditMode.log
          .\tools\Assert-UnityTestResults.ps1 -Path Logs/EditMode.xml

      - name: Build Android development APK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\Invoke-Unity.ps1 -ProjectPath . -batchmode -quit `
            -executeMethod Unity6.Ci.CiPlayerBuild.BuildAndroidDevelopment `
            -logFile Logs/build-android.log `
            --ci-output .workspace/builds/android/Unity6-Android-Development.apk `
            --ci-scenes Assets/Tests/BuildPipeline/Fixtures/BuildPipelineSmoke.unity
          .\tools\Wait-CiOutput.ps1 `
            -Path .workspace/builds/android/Unity6-Android-Development.apk `
            -Label "Android APK" `
            -TimeoutSeconds 5400 `
            -LogPath Logs/build-android.log

      - name: Build Windows development player
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\Invoke-Unity.ps1 -ProjectPath . -batchmode -quit `
            -executeMethod Unity6.Ci.CiPlayerBuild.BuildWindowsDevelopment `
            -logFile Logs/build-windows.log `
            --ci-output .workspace/builds/windows/Unity6-Windows-Development/Unity6.exe `
            --ci-scenes Assets/Tests/BuildPipeline/Fixtures/BuildPipelineSmoke.unity
          .\tools\Wait-CiOutput.ps1 `
            -Path .workspace/builds/windows/Unity6-Windows-Development/Unity6.exe `
            -Label "Windows player executable" `
            -TimeoutSeconds 5400 `
            -LogPath Logs/build-windows.log

      - name: Package Windows player
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $source = ".workspace/builds/windows/Unity6-Windows-Development"
          $archive = ".workspace/builds/windows/Unity6-Windows-Development.zip"
          if (-not (Test-Path "$source/Unity6.exe")) {
            throw "Windows player executable was not found: $source/Unity6.exe"
          }
          if (Test-Path $archive) {
            Remove-Item -LiteralPath $archive -Force
          }
          Compress-Archive -Path "$source/*" -DestinationPath $archive -Force

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: Unity6-Android-Development
          path: .workspace/builds/android/Unity6-Android-Development.apk
          if-no-files-found: error

      - name: Upload Windows player
        uses: actions/upload-artifact@v7
        with:
          name: Unity6-Windows-Development
          path: .workspace/builds/windows/Unity6-Windows-Development.zip
          if-no-files-found: error

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Unity6-CI-Logs
          path: |
            Logs/EditMode.xml
            Logs/EditMode.log
            Logs/build-android.log
            Logs/build-windows.log
          if-no-files-found: warn
