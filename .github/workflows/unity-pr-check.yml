name: Unity PR Quick Check

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: unity6-pr-check-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: Validate virtual merge
    runs-on:
      - self-hosted
      - Windows
      - unity6
    timeout-minutes: 60

    steps:
      - name: Show virtual merge context
        shell: powershell
        run: |
          Write-Host "PR #${{ github.event.pull_request.number }}"
          Write-Host "Head branch: ${{ github.event.pull_request.head.ref }}"
          Write-Host "Target branch: ${{ github.event.pull_request.base.ref }}"
          Write-Host "Checkout ref: refs/pull/${{ github.event.pull_request.number }}/merge"

      - name: Checkout virtual merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            svn-assets.lock.json
            .github/workflows/unity-ci.yml
            .github/workflows/unity-pr-check.yml
            Packages/**
            ProjectSettings/**
            Assets/csc.rsp
            Assets/csc.rsp.meta
            Assets/Editor.meta
            Assets/Editor/**
            Assets/Scripts.meta
            Assets/Scripts/Addressables.meta
            Assets/Scripts/Addressables/**
            Assets/Settings.meta
            Assets/Settings/**
            Assets/GameResources.meta
            Assets/GameResources/Characters/Qianxia/**
            Assets/Tests.meta
            Assets/Tests/BuildPipeline.meta
            Assets/Tests/BuildPipeline/**
            Assets/Tests/Qianxia.meta
            Assets/Tests/Qianxia/**
            tools/Invoke-Unity.ps1
            tools/Sync-SvnAssets.ps1
            tools/Use-UnityLibraryCache.ps1
            tools/Wait-CiOutput.ps1
            tools/Assert-UnityTestResults.ps1

      - name: Sync SVN art assets
        shell: powershell
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\Sync-SvnAssets.ps1 -ProjectPath .

      - name: Attach Unity Library cache
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\Use-UnityLibraryCache.ps1 -ProjectPath .

      - name: Clean quick check outputs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "Logs" | Out-Null
          Remove-Item -LiteralPath "Logs/BuildPipelineEditMode.xml" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "Logs/BuildPipelineEditMode.log" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "Logs/QianxiaEditMode.xml" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "Logs/QianxiaEditMode.log" -Force -ErrorAction SilentlyContinue

      - name: Run build pipeline EditMode tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\Invoke-Unity.ps1 -ProjectPath . -batchmode `
            -runTests -testPlatform EditMode `
            -assemblyNames Project.BuildPipeline.EditMode.Tests `
            -testResults Logs/BuildPipelineEditMode.xml `
            -logFile Logs/BuildPipelineEditMode.log
          .\tools\Wait-CiOutput.ps1 `
            -Path Logs/BuildPipelineEditMode.xml `
            -Label "Build pipeline EditMode test results" `
            -TimeoutSeconds 1200 `
            -LogPath Logs/BuildPipelineEditMode.log
          .\tools\Assert-UnityTestResults.ps1 -Path Logs/BuildPipelineEditMode.xml

      - name: Run Qianxia EditMode tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\Invoke-Unity.ps1 -ProjectPath . -batchmode `
            -runTests -testPlatform EditMode `
            -assemblyNames Project.Qianxia.EditMode.Tests `
            -testResults Logs/QianxiaEditMode.xml `
            -logFile Logs/QianxiaEditMode.log
          .\tools\Wait-CiOutput.ps1 `
            -Path Logs/QianxiaEditMode.xml `
            -Label "Qianxia EditMode test results" `
            -TimeoutSeconds 1200 `
            -LogPath Logs/QianxiaEditMode.log
          .\tools\Assert-UnityTestResults.ps1 -Path Logs/QianxiaEditMode.xml

      - name: Upload quick check logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Unity6-PR-Quick-Check-Logs
          path: |
            Logs/BuildPipelineEditMode.xml
            Logs/BuildPipelineEditMode.log
            Logs/QianxiaEditMode.xml
            Logs/QianxiaEditMode.log
          if-no-files-found: warn
