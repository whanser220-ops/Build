schema_version: 1
catalog_id: qianxia.gpu_pass_catalog
marker_format: "[{pass_id}] {display_name}"
passes:
  - pass_id: crowd.workset.build_alive_list
    display_name: Crowd / Workset / Build Alive List
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: BuildAliveInstanceList
    owner: crowd_system
    aliases: [Crowd.Update.BuildAliveList]
    purpose: >
      Compact all non-dead crowd instances into the alive workset used by
      simulation, culling, combat and rendering passes.
    inputs:
      - name: _InstanceCount
        type: Constant
        access: read
        meaning: Total runtime crowd instance count.
      - name: _DeathStateBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Per-instance death state used to reject inactive agents.
    outputs:
      - name: _AliveInstanceCounterBuffer
        type: RWStructuredBuffer<uint>
        access: read_write
        meaning: Atomic count of alive instances.
      - name: _AliveInstanceIndexBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Dense list of alive instance indices.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: ceil(instance_count / 64)
      data_parallel_unit: one_thread_per_instance
    performance_hints:
      memory_pattern: sequential_scan_plus_atomic_append
      expected_bottleneck: atomic_append_when_alive_ratio_is_high
      has_atomics: true
      has_group_shared_memory: false
      branch_divergence_risk: low
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: BuildAliveInstanceList

  - pass_id: crowd.workset.build_alive_dispatch_args
    display_name: Crowd / Workset / Build Alive Dispatch Args
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: BuildAliveDispatchArgs
    owner: crowd_system
    aliases: [Crowd.Update.BuildAliveDispatchArgs]
    purpose: >
      Convert the alive instance count into indirect dispatch arguments for
      later alive-workset compute passes.
    inputs:
      - name: _AliveInstanceCounterBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Alive instance count produced by alive compaction.
    outputs:
      - name: _AliveInstanceDispatchArgsBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Three uint dispatch dimensions for alive indirect dispatch.

      - name: _AliveInstanceCountValue
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Single uint dispatch X dimension written alongside full dispatch args.
    dispatch:
      thread_group_size: [1, 1, 1]
      group_count_formula: 1
      data_parallel_unit: one_thread_per_dispatch_args
    performance_hints:
      memory_pattern: single_counter_read_single_args_write
      expected_bottleneck: none_unless_synchronized_with_previous_pass
      has_atomics: false
      has_group_shared_memory: false
      branch_divergence_risk: low
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: BuildAliveDispatchArgs

  - pass_id: crowd.wake_grid.clear
    display_name: Crowd / Wake Grid / Clear
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: ClearWakeGrid
    owner: crowd_system
    aliases: [Crowd.Update.WakeGridClear]
    purpose: >
      Clear the lightweight wake grid counters before rebuilding neighbor wake
      information for physics activation.
    inputs:
      - name: _WakeGridCellCount
        type: Constant
        access: read
        meaning: Number of wake grid cells.
    outputs:
      - name: _WakeGridCounterBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Per-cell wake occupancy counter reset to zero.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: ceil(wake_grid_cell_count / 64)
      data_parallel_unit: one_thread_per_wake_grid_cell
    performance_hints:
      memory_pattern: linear_grid_clear
      expected_bottleneck: memory_bandwidth_when_grid_is_large
      has_atomics: false
      has_group_shared_memory: false
      branch_divergence_risk: low
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: ClearWakeGrid

  - pass_id: crowd.wake_grid.build
    display_name: Crowd / Wake Grid / Build
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: BuildWakeGrid
    owner: crowd_system
    aliases: [Crowd.Update.WakeGridBuild]
    purpose: >
      Scatter alive instances into a coarse wake grid used to wake nearby
      physics agents.
    inputs:
      - name: _AliveInstanceIndexBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Alive workset used as source instances.
      - name: _SimulationStateBuffer
        type: StructuredBuffer<InstanceSimulationState>
        access: read
        meaning: Per-instance local position used to choose a wake cell.
    outputs:
      - name: _WakeGridCounterBuffer
        type: RWStructuredBuffer<uint>
        access: read_write
        meaning: Atomic per-cell wake occupancy count.
      - name: _WakeGridOccupantBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Bounded instance indices per wake grid cell.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: indirect_alive_count
      data_parallel_unit: one_thread_per_alive_instance
    performance_hints:
      memory_pattern: spatial_hash_scatter
      expected_bottleneck: atomic_contention_in_dense_cells
      has_atomics: true
      has_group_shared_memory: false
      branch_divergence_risk: medium
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: BuildWakeGrid

  - pass_id: crowd.workset.evaluate_physics_active
    display_name: Crowd / Workset / Evaluate Physics Active
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: EvaluatePhysicsActive
    owner: crowd_system
    aliases: [Crowd.Update.EvaluatePhysicsActive]
    purpose: >
      Decide which alive instances should remain in the expensive physics
      simulation set based on command motion, wake state, neighbor activity and
      sleep timers.
    inputs:
      - name: _AliveInstanceIndexBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Alive workset to evaluate.
      - name: _WakeGridCounterBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Neighbor wake information.
      - name: _PhysicsActivationMetaBuffer
        type: RWStructuredBuffer<float4>
        access: read_write
        meaning: Hold timers, sleep timers and previous correction magnitude.
    outputs:
      - name: _PhysicsActiveStateBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Per-instance active flag for physics simulation.
      - name: _PhysicsActivationMetaBuffer
        type: RWStructuredBuffer<float4>
        access: read_write
        meaning: Updated active/sleep metadata.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: indirect_alive_count
      data_parallel_unit: one_thread_per_alive_instance
    performance_hints:
      memory_pattern: indirect_workset_with_neighbor_wake_reads
      expected_bottleneck: branch_divergence_and_random_wake_grid_reads
      has_atomics: false
      has_group_shared_memory: false
      branch_divergence_risk: high
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: EvaluatePhysicsActive

  - pass_id: crowd.workset.build_physics_active_list
    display_name: Crowd / Workset / Build Physics Active List
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: BuildPhysicsActiveInstanceList
    owner: crowd_system
    aliases: [Crowd.Update.BuildPhysicsActiveList]
    purpose: >
      Compact alive instances whose physics-active flag is set into the
      workset used by crowd collision and grid simulation passes.
    inputs:
      - name: _AliveInstanceIndexBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Alive source workset.
      - name: _PhysicsActiveStateBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Per-instance physics-active flag.
    outputs:
      - name: _PhysicsActiveInstanceCounterBuffer
        type: RWStructuredBuffer<uint>
        access: read_write
        meaning: Atomic physics-active instance count.
      - name: _PhysicsActiveInstanceIndexBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Dense physics-active instance list.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: indirect_alive_count
      data_parallel_unit: one_thread_per_alive_instance
    performance_hints:
      memory_pattern: indirect_scan_plus_atomic_append
      expected_bottleneck: atomic_append_when_active_ratio_is_high
      has_atomics: true
      has_group_shared_memory: false
      branch_divergence_risk: medium
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: BuildPhysicsActiveInstanceList

  - pass_id: crowd.workset.build_physics_active_dispatch_args
    display_name: Crowd / Workset / Build Physics Active Dispatch Args
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: BuildPhysicsActiveDispatchArgs
    owner: crowd_system
    aliases: [Crowd.Update.BuildPhysicsActiveDispatchArgs]
    purpose: >
      Convert the physics-active count into indirect dispatch arguments for
      physics-active simulation passes.
    inputs:
      - name: _PhysicsActiveInstanceCounterBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Physics-active instance count.
    outputs:
      - name: _PhysicsActiveInstanceDispatchArgsBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Three uint dispatch dimensions for physics-active passes.

      - name: _PhysicsActiveInstanceCountValue
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Single uint dispatch X dimension for physics-active indirect dispatch.
    dispatch:
      thread_group_size: [1, 1, 1]
      group_count_formula: 1
      data_parallel_unit: one_thread_per_dispatch_args
    performance_hints:
      memory_pattern: single_counter_read_single_args_write
      expected_bottleneck: none_unless_synchronized_with_previous_pass
      has_atomics: false
      has_group_shared_memory: false
      branch_divergence_risk: low
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: BuildPhysicsActiveDispatchArgs

  - pass_id: crowd.combat.evaluate_active
    display_name: Crowd / Combat / Evaluate Active
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: EvaluateCombatActive
    owner: crowd_system
    aliases: [Crowd.Combat.EvaluateActive]
    purpose: >
      Decide which alive instances need combat processing based on target
      state, visual feedback hold timers and staggered probe frames.
    inputs:
      - name: _AliveInstanceIndexBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Alive source workset.
      - name: _CombatStateBuffer
        type: StructuredBuffer<InstanceCombatStateData>
        access: read
        meaning: Current combat visual and target state.
      - name: _TargetAcquisitionStateBuffer
        type: StructuredBuffer<TargetAcquisitionStateData>
        access: read
        meaning: Per-instance target acquisition state.
    outputs:
      - name: _CombatActiveStateBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Per-instance combat-active flag.
      - name: _CombatActivationMetaBuffer
        type: RWStructuredBuffer<float4>
        access: read_write
        meaning: Combat hold timer, reason mask and target debug metadata.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: indirect_alive_count
      data_parallel_unit: one_thread_per_alive_instance
    performance_hints:
      memory_pattern: indirect_workset_state_reads
      expected_bottleneck: branch_divergence_from_probe_and_visual_state
      has_atomics: false
      has_group_shared_memory: false
      branch_divergence_risk: medium
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: EvaluateCombatActive

  - pass_id: crowd.combat.build_active_list
    display_name: Crowd / Combat / Build Active List
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: BuildCombatActiveInstanceList
    owner: crowd_system
    aliases: [Crowd.Combat.BuildActiveList]
    purpose: >
      Compact alive instances marked combat-active into an indirect workset for
      target acquisition and combat resolution.
    inputs:
      - name: _AliveInstanceIndexBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Alive source workset.
      - name: _CombatActiveStateBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Combat-active flag produced by evaluation.
    outputs:
      - name: _CombatActiveInstanceCounterBuffer
        type: RWStructuredBuffer<uint>
        access: read_write
        meaning: Atomic combat-active instance count.
      - name: _CombatActiveInstanceIndexBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Dense combat-active instance list.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: indirect_alive_count
      data_parallel_unit: one_thread_per_alive_instance
    performance_hints:
      memory_pattern: indirect_scan_plus_atomic_append
      expected_bottleneck: atomic_append_when_combat_active_ratio_is_high
      has_atomics: true
      has_group_shared_memory: false
      branch_divergence_risk: medium
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: BuildCombatActiveInstanceList

  - pass_id: crowd.combat.compact_active_list
    display_name: Crowd / Combat / Compact Active List
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: CompactCombatActiveInstanceList
    owner: crowd_system
    aliases: [Crowd.Combat.CompactActiveList]
    purpose: >
      Merge the target-priority combat-active suffix into the dense combat
      workset prefix after the append pass split active instances by reason.
    inputs:
      - name: _CombatActiveInstanceCounterBuffer
        type: RWStructuredBuffer<uint>
        access: read_write
        meaning: Counter 0 stores visual/probe active count; counter 1 stores target-priority active count.
      - name: _CombatActiveInstanceIndexBuffer
        type: RWStructuredBuffer<uint>
        access: read_write
        meaning: Combat-active list with target-priority entries temporarily appended from the end.
    outputs:
      - name: _CombatActiveInstanceCounterBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Counter 0 updated to the final merged combat-active count.
      - name: _CombatActiveInstanceIndexBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Dense combat-active list with target-priority entries copied behind the prefix.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: ceil(instance_count / 64)
      data_parallel_unit: one_thread_per_target_priority_combat_active_instance
    performance_hints:
      memory_pattern: suffix_to_prefix_compaction
      expected_bottleneck: memory_copy_when_many_agents_have_targets
      has_atomics: false
      has_group_shared_memory: false
      branch_divergence_risk: low
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: CompactCombatActiveInstanceList

  - pass_id: crowd.combat.build_active_dispatch_args
    display_name: Crowd / Combat / Build Active Dispatch Args
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: BuildCombatActiveDispatchArgs
    owner: crowd_system
    aliases: [Crowd.Combat.BuildActiveDispatchArgs]
    purpose: >
      Convert the combat-active count into indirect dispatch arguments for
      combat processing passes.
    inputs:
      - name: _CombatActiveInstanceCounterBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Combat-active instance count.
    outputs:
      - name: _CombatActiveInstanceDispatchArgsBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Three uint dispatch dimensions for combat-active passes.

      - name: _CombatActiveInstanceCountValue
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Single uint dispatch X dimension for combat-active indirect dispatch.
    dispatch:
      thread_group_size: [1, 1, 1]
      group_count_formula: 1
      data_parallel_unit: one_thread_per_dispatch_args
    performance_hints:
      memory_pattern: single_counter_read_single_args_write
      expected_bottleneck: none_unless_synchronized_with_previous_pass
      has_atomics: false
      has_group_shared_memory: false
      branch_divergence_risk: low
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: BuildCombatActiveDispatchArgs

  - pass_id: crowd.combat.clear_candidate_counters
    display_name: Crowd / Combat / Clear Candidate Counters
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: ClearCombatSquadCandidateCounters
    owner: crowd_system
    aliases: [Crowd.Combat.ClearCandidateCounters]
    purpose: >
      Clear per-squad combat candidate counters before rebuilding broadphase
      candidate clusters.
    inputs:
      - name: _SquadStateCount
        type: Constant
        access: read
        meaning: Runtime squad count.
    outputs:
      - name: _CombatSquadCandidateCounterBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Per-squad candidate counter reset to zero.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: ceil(squad_state_count / 64)
      data_parallel_unit: one_thread_per_squad
    performance_hints:
      memory_pattern: linear_squad_counter_clear
      expected_bottleneck: none_unless_squad_count_is_large
      has_atomics: false
      has_group_shared_memory: false
      branch_divergence_risk: low
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: ClearCombatSquadCandidateCounters

  - pass_id: crowd.combat.build_candidate_clusters
    display_name: Crowd / Combat / Build Candidate Clusters
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: BuildCombatCandidateClusters
    owner: crowd_system
    aliases: [Crowd.Combat.BuildCandidateClusters]
    purpose: >
      Scan CPU-built runtime squad broadphase cell-tile work items and append
      bounded hostile instance candidates inside combat range without broadcasting
      the largest squad tile count to every squad.
    inputs:
      - name: _SquadStateBuffer
        type: StructuredBuffer<SquadStateData>
        access: read
        meaning: Runtime squad centers, faction and bounds.
      - name: _GridCounterBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Spatial grid occupancy counts.
      - name: _GridOccupantBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Candidate instance indices per grid cell.
      - name: _CombatCandidateClusterWorkItemBuffer
        type: StructuredBuffer<CombatCandidateClusterWorkItemData>
        access: read
        meaning: Per-dispatch work items containing source squad index, tile begin, cell width/count and clamped grid min coordinate.
    outputs:
      - name: _CombatSquadCandidateCounterBuffer
        type: RWStructuredBuffer<uint>
        access: read_write
        meaning: Atomic candidate count per source squad.
      - name: _CombatSquadCandidateBuffer
        type: RWStructuredBuffer<CombatSquadCandidateData>
        access: write
        meaning: Bounded hostile candidates per source squad, prepacked with target index, faction, target top local position and scale.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: indirect_dispatch(sum(per_squad_candidate_cluster_tile_count), 1, 1)
      data_parallel_unit: one_thread_per_grid_occupant_in_cpu_built_squad_cell_tile_work_item
    performance_hints:
      memory_pattern: compact_squad_tile_workset_scan_with_per_candidate_atomic_append
      expected_bottleneck: dense_candidate_record_writes_and_per_squad_atomic_append
      has_atomics: true
      has_group_shared_memory: false
      branch_divergence_risk: medium
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectWorksets.hlsl
      function: BuildCombatCandidateClusters

  - pass_id: crowd.render.clear_runtime_squad_bounds
    display_name: Crowd / Render / Clear Runtime Squad Bounds
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: ClearVisibleRuntimeSquadBounds
    owner: crowd_system
    aliases: [Crowd.Culling.ClearRuntimeSquadBounds]
    purpose: >
      Reset per-squad runtime AABB accumulators and visibility masks before the
      GPU-driven squad coarse culling prepass.
    inputs:
      - name: _SquadStateCount
        type: Constant
        access: read
        meaning: Number of active runtime squads to clear.
    outputs:
      - name: _RuntimeSquadBoundsBuffer
        type: RWStructuredBuffer<RuntimeSquadBoundsData>
        access: write
        meaning: Per-squad ordered min/max bounds reset to empty sentinels.
      - name: _VisibleRuntimeSquadMaskBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Per-squad visibility mask reset to zero.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: ceil(squad_state_count / 64)
      data_parallel_unit: one_thread_per_squad
    performance_hints:
      memory_pattern: linear_squad_clear
      expected_bottleneck: memory_bandwidth_when_squad_count_is_large
      has_atomics: false
      has_group_shared_memory: false
      branch_divergence_risk: low
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectCulling.hlsl
      function: ClearVisibleRuntimeSquadBounds

  - pass_id: crowd.render.build_runtime_squad_bounds
    display_name: Crowd / Render / Build Runtime Squad Bounds
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: BuildVisibleRuntimeSquadBounds
    owner: crowd_system
    aliases: [Crowd.Culling.BuildRuntimeSquadBounds]
    purpose: >
      Scan alive runtime instances, reconstruct their per-instance render AABB
      on the GPU, and atomically accumulate per-squad min/max bounds for the
      next coarse culling stage.
    inputs:
      - name: _AliveInstanceIndexBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Alive source workset.
      - name: _SimulationStateBuffer
        type: StructuredBuffer<InstanceSimulationState>
        access: read
        meaning: Current transform state used to rebuild per-instance bounds.
      - name: _AgentSquadDataBuffer
        type: StructuredBuffer<AgentSquadData>
        access: read
        meaning: Per-instance runtime squad assignment.
    outputs:
      - name: _RuntimeSquadBoundsBuffer
        type: RWStructuredBuffer<RuntimeSquadBoundsData>
        access: read_write
        meaning: Per-squad ordered min/max bounds updated through atomic min/max.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: indirect_alive_count
      data_parallel_unit: one_thread_per_alive_instance
    performance_hints:
      memory_pattern: indirect_scan_plus_per_squad_atomic_minmax
      expected_bottleneck: atomic_minmax_contention_in_dense_runtime_squads
      has_atomics: true
      has_group_shared_memory: false
      branch_divergence_risk: medium
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectCulling.hlsl
      function: BuildVisibleRuntimeSquadBounds

  - pass_id: crowd.render.cull_runtime_squads
    display_name: Crowd / Render / Cull Runtime Squads
    type: compute
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirect.compute
    kernel: CullVisibleRuntimeSquads
    owner: crowd_system
    aliases: [Crowd.Culling.CullRuntimeSquads]
    purpose: >
      Test each GPU-built runtime squad AABB against the camera frustum and
      write the coarse visibility mask consumed by the instance compaction pass.
    inputs:
      - name: _RuntimeSquadBoundsBuffer
        type: StructuredBuffer<RuntimeSquadBoundsData>
        access: read
        meaning: Per-squad AABB generated from alive instances.
      - name: _VisibleFrustumPlanes
        type: Constant
        access: read
        meaning: Camera frustum planes plus root transform used for local AABB tests.
    outputs:
      - name: _VisibleRuntimeSquadMaskBuffer
        type: RWStructuredBuffer<uint>
        access: write
        meaning: Per-squad coarse visibility mask for the final instance pass.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: ceil(squad_state_count / 64)
      data_parallel_unit: one_thread_per_squad
    performance_hints:
      memory_pattern: sequential_squad_bounds_read_plus_plane_tests
      expected_bottleneck: plane_test_alu_when_squad_count_is_high
      has_atomics: false
      has_group_shared_memory: false
      branch_divergence_risk: low
    source:
