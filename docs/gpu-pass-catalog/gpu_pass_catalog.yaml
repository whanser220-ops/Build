    outputs:
      - name: _TargetAcquisitionStateBuffer
        type: RWStructuredBuffer<TargetAcquisitionStateData>
        access: read_write
        meaning: Current target, timers, flags and debug reject counters.
      - name: _TargetAcquisitionCandidateBuffer
        type: RWStructuredBuffer<TargetAcquisitionCandidateData>
        access: write
        meaning: Fixed slots per instance; slot 0 current target recheck, plus fallback Top-K candidates for non-squad agents.
