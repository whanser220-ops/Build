  - pass_id: crowd.render.skinned_mesh
    display_name: Crowd / Render / Skinned Mesh
    type: indirect_draw
    shader: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectLit.shader
    kernel: UniversalForward
    shader_pass: UniversalForward
    owner: crowd_system
    aliases: [Crowd.Render.SkinnedMesh]
    purpose: >
      Draw visible VAT crowd instances using indirect draw arguments and
      per-instance transform/frame buffers produced by compute passes. The
      renderer submits this draw once per active render LOD tier, reusing the
      same lit VAT shader with tier-specific mesh/material resources.
    inputs:
      - name: _VisibleRenderArgsBuffer
        type: IndirectDrawIndexedArgs
        access: read
        meaning: Current render LOD tier indirect draw argument record.
      - name: _VisibleInstanceIndices
        type: StructuredBuffer<uint>
        access: read
        meaning: Current render LOD tier visible source instance indices; the material binding is rebound per draw to the LOD0, LOD1 or LOD2 compaction buffer.
      - name: _InstanceTransforms
        type: StructuredBuffer<MatrixRows>
        access: read
        meaning: Per-instance render transform rows.
      - name: _InstanceFrameData
        type: StructuredBuffer<float4>
        access: read
        meaning: VAT frame and blend data.
    indirect_draw:
      draw_kind: render_mesh_indirect
      args_buffer: _VisibleRenderArgsBuffer
      visible_instance_buffer: _VisibleInstanceIndices
      instance_count_formula: lod0_visible_instance_count + lod1_visible_instance_count + lod2_visible_instance_count
    performance_hints:
      memory_pattern: indirect_visible_instance_fetch
      expected_bottleneck: vertex_texture_animation_and_instance_buffer_bandwidth
      has_atomics: false
      has_group_shared_memory: false
      branch_divergence_risk: low
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectLit.shader
      function: UniversalForward

