    purpose: >
      Apply per-instance combat state updates, damage feedback, cooldowns and
      shot visual state for combat-active agents, while keeping no-target and
      non-firing instances on a fast path and reserving target revalidation,
      SDF tracing and hit resolution for actual firing attempts.
    inputs:
      - name: _CombatActiveInstanceIndexBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Combat-active workset.
      - name: _TargetAcquisitionStateBuffer
        type: StructuredBuffer<TargetAcquisitionStateData>
        access: read
        meaning: Target chosen by acquisition.
      - name: _DeathStateBuffer
        type: StructuredBuffer<uint>
        access: read
        meaning: Health/death state for damage resolution.
    outputs:
      - name: _CombatStateBuffer
        type: RWStructuredBuffer<InstanceCombatStateData>
        access: read_write
        meaning: Updated combat state, visuals and shot debug metadata.
      - name: _DeathStateBuffer
        type: RWStructuredBuffer<uint>
        access: read_write
        meaning: Updated target death/health state when shots hit.
    dispatch:
      thread_group_size: [64, 1, 1]
      group_count_formula: indirect_combat_active_count
      data_parallel_unit: one_thread_per_combat_active_instance
    performance_hints:
      memory_pattern: per_agent_state_update_with_target_random_access
      expected_bottleneck: branch_divergence_and_random_target_state_writes
      has_atomics: true
      has_group_shared_memory: false
      branch_divergence_risk: high
      fast_path_split: no_target_or_cooldown_only_instances_exit_before_los_sdf_and_hit_resolution
    source:
      file: Assets/Project/Crowds/VAT/Shader/CrowdVatIndirectCombat.hlsl
      function: ResolveInstanceCombat

